<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Paper Log{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="top">
    <a class="brand" href="{{ url_for('index') }}">📄 Paper Log</a>
    <nav>
      <a href="{{ url_for('index') }}">Today</a>
      <a href="{{ url_for('notes') }}">All notes</a>
      <a class="btn small" href="{{ url_for('new') }}">+ New note</a>
    </nav>
    <span class="streak {% if done_today %}on{% endif %}" title="Current streak">🔥 {{ streak }}</span>
  </header>
  <main>
    {% with msgs = get_flashed_messages(with_categories=true) %}
      {% for cat, m in msgs %}<div class="flash {{ cat }}">{{ m }}</div>{% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
